<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Create your FinWise Women account">

    <title>Register | FinWise Women</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="logo">
            💰 FinWise Women
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="learn.html">
                Learn
            </a>

            <a href="budget.html">
                Budget
            </a>

            <a href="savings.html">
                Savings
            </a>

            <a href="chatbot.html">
                AI Assistant
            </a>

            <a href="safety.html">
                Safety
            </a>

            <a href="login.html"
               class="nav-login">
                Login
            </a>

        </nav>

    </header>


    <!-- ================= REGISTER ================= -->

    <main>

        <section class="auth-section">

            <div class="auth-card">

                <div class="auth-icon">
                    🌸
                </div>

                <h1>
                    Create Account
                </h1>

                <p class="auth-subtitle">
                    Start your financial learning journey with FinWise Women.
                </p>


                <!-- REGISTER FORM -->

                <form id="registerForm">

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Minimum 6 characters"
                            minlength="6"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            minlength="6"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary auth-button">
                        Create Account
                    </button>

                </form>


                <!-- MESSAGE -->

                <p id="registerMessage"
                   class="auth-message">
                </p>


                <!-- LOGIN -->

                <p class="auth-footer">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <div class="footer-bottom">

            <p>
                © 2026 FinWise Women
            </p>

            <p>
                Educational platform — not financial advice.
            </p>

        </div>

    </footer>


    <script src="script.js"></script>


    <!-- REGISTER JAVASCRIPT -->

    <script>

        const registerForm =
            document.getElementById("registerForm");

        const registerMessage =
            document.getElementById("registerMessage");


        registerForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const name =
                    document.getElementById("name")
                        .value.trim();

                const email =
                    document.getElementById("email")
                        .value.trim();

                const password =
                    document.getElementById("password")
                        .value;

                const confirmPassword =
                    document.getElementById("confirmPassword")
                        .value;


                // Check passwords

                if (password !== confirmPassword) {

                    registerMessage.textContent =
                        "❌ Passwords do not match.";

                    return;
                }


                if (password.length < 6) {

                    registerMessage.textContent =
                        "❌ Password must be at least 6 characters.";

                    return;
                }


                registerMessage.textContent =
                    "Creating account...";


                try {

                    const response =
                        await fetch("https://YOUR-BACKEND-URL.onrender.com/api/auth/register", {

                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({

                                name: name,
                                email: email,
                                password: password

                            })

                        });


                    const data =
                        await response.json();


                    if (!response.ok) {

                        registerMessage.textContent =
                            "❌ " + data.message;

                        return;
                    }


                    registerMessage.textContent =
                        "✅ Registration successful!";


                    registerForm.reset();


                    // Redirect to login

                    setTimeout(function () {

                        window.location.href =
                            "login.html";

                    }, 1000);


                } catch (error) {

                    console.error(error);

                    registerMessage.textContent =
                        "❌ Unable to connect to server.";

                }

            }
        );

    </script>

</body>

</html>
