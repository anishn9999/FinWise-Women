<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Login to FinWise Women">

    <title>Login | FinWise Women</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="logo">
            💰 FinWise Women
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="learn.html">
                Learn
            </a>

            <a href="budget.html">
                Budget
            </a>

            <a href="savings.html">
                Savings
            </a>

            <a href="chatbot.html">
                AI Assistant
            </a>

            <a href="safety.html">
                Safety
            </a>

        </nav>

    </header>


    <!-- ================= LOGIN ================= -->

    <main>

        <section class="auth-section">

            <div class="auth-card">

                <div class="auth-icon">
                    🔐
                </div>

                <h1>
                    Welcome Back
                </h1>

                <p class="auth-subtitle">
                    Login to continue your financial learning journey.
                </p>


                <!-- LOGIN FORM -->

                <form id="loginForm">

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary auth-button">
                        Login
                    </button>

                </form>


                <!-- MESSAGE -->

                <p id="loginMessage"
                   class="auth-message">
                </p>


                <!-- REGISTER -->

                <p class="auth-footer">

                    Don't have an account?

                    <a href="register.html">
                        Create Account
                    </a>

                </p>

            </div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <div class="footer-bottom">

            <p>
                © 2026 FinWise Women
            </p>

            <p>
                Educational platform — not financial advice.
            </p>

        </div>

    </footer>


    <script src="script.js"></script>


    <!-- LOGIN JAVASCRIPT -->

    <script>

        const loginForm =
            document.getElementById("loginForm");

        const loginMessage =
            document.getElementById("loginMessage");


        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;


                loginMessage.textContent =
                    "Logging in...";


                try {

                    const response =
                        await fetch("/api/auth/login", {

                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                email: email,
                                password: password
                            })

                        });


                    const data =
                        await response.json();


                    if (!response.ok) {

                        loginMessage.textContent =
                            "❌ " + data.message;

                        return;
                    }


                    // Save login information

                    localStorage.setItem(
                        "token",
                        data.token
                    );

                    localStorage.setItem(
                        "user",
                        JSON.stringify(data.user)
                    );


                    loginMessage.textContent =
                        "✅ Login successful!";


                    // Go to dashboard

                    setTimeout(function () {

                        window.location.href =
                            "dashboard.html";

                    }, 800);


                } catch (error) {

                    console.error(error);

                    loginMessage.textContent =
                        "❌ Unable to connect to server.";

                }

            }
        );

    </script>

</body>

</html>
